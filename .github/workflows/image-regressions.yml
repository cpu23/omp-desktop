name: Image regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  image-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run check
      - run: bun test
      - run: bun run smoke:images
