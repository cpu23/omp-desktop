name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check, tests, and daemon smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check

      - name: Run tests
        run: bun test

      - name: Smoke-test daemon APIs in isolated home
        run: bun run scripts/daemon-smoke.ts

  native-linux:
    name: Native Linux GTK4/WebKitGTK6 smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install native Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            apparmor \
            at-spi2-core \
            build-essential \
            dbus-x11 \
            gir1.2-atspi-2.0 \
            libgl1-mesa-dri \
            libgtk-4-dev \
            libsoup-3.0-dev \
            libwebkitgtk-6.0-dev \
            openbox \
            python3-gi \
            pkg-config \
            scrot \
            webkit2gtk-driver \
            wmctrl \
            x11-utils \
            xclip \
            xdotool \
            xvfb

      - name: Allow bubblewrap user namespaces for the WebKit sandbox
        run: |
          # WebKit requires user namespaces from bwrap on Ubuntu 24.04:
          # https://bugs.launchpad.net/ubuntu/+source/bubblewrap/+bug/2144531
          probe_bwrap() {
            bwrap --unshare-user --unshare-pid --ro-bind / / /usr/bin/true
          }
          if probe_bwrap; then
            echo "WebKit bubblewrap user/pid namespaces are available."
          else
            restriction="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || printf '0')"
            if [ "$restriction" != "1" ]; then
              echo "WebKit bubblewrap user namespaces are unavailable and Ubuntu AppArmor restriction is not enabled; refusing to weaken sandbox policy." >&2
              exit 1
            fi
            if ! sudo test -r /sys/kernel/security/apparmor/profiles; then
              echo "Cannot inspect loaded AppArmor profiles; refusing to replace or layer policy blindly." >&2
              exit 1
            fi
            if [ -e /etc/apparmor.d/bwrap ] || sudo grep -R -Fq '/usr/bin/bwrap' /etc/apparmor.d || sudo grep -Eq '^bwrap \(' /sys/kernel/security/apparmor/profiles; then
              echo "Existing bwrap AppArmor policy is preserved; it does not permit the WebKit sandbox prerequisite." >&2
              exit 1
            fi
            sudo tee /etc/apparmor.d/bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
            sudo apparmor_parser -a /etc/apparmor.d/bwrap
            probe_bwrap
          fi

      - name: Set up Rust 1.92
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.92.0

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run GTK-independent Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build the GTK4/WebKitGTK6 application once
        run: bun run app:build

      - name: Exercise the real GTK4 shell and DOM image assertions
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: gl
          OMP_DESKTOP_NATIVE_SCREENSHOT: ${{ runner.temp }}/native-smoke.png
        run: xvfb-run -a dbus-run-session -- bun run smoke:native -- --images

      - name: Upload native shell screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-shell-screenshot
          path: ${{ runner.temp }}/native-smoke*.png
          if-no-files-found: ignore

  native-macos:
    name: Retained macOS Tauri build and tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust 1.92
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.92.0

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build retained Tauri shell
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release

      - name: Run retained platform Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  native-windows:
    name: Retained Windows Tauri build and tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust 1.92
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.92.0

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build retained Tauri shell
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release

      - name: Run retained platform Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
