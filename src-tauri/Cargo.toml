[package]
name = "omp-desktop"
version = "0.1.4"
description = "Native shell for the omp-desktop daemon"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
open = "5"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.11.5", features = ["v4_14"] }
webkit6 = { version = "0.6.1", features = ["v2_44"] }
futures-channel = "0.3"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
