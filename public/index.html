<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>omp desktop</title>
    <link rel="stylesheet" href="/xterm.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Space tabs sit above the pane workspace. #status remains in the sidebar
         so connection failures stay visible, and #build stays in the DOM (hidden)
         for the client's bundle-reload check. The resizer and collapsed-state
         expand control are wired by src/sidebar.ts; motion settings are wired
         by src/working-indicator.ts. -->
    <div id="app">
      <aside id="sidebar">
        <div class="side-block side-search">
          <input id="search" type="search" placeholder="search sessions…" autocomplete="off" spellcheck="false" />
          <button id="sidebar-settings-open" class="sidebar-toggle" type="button" title="Sidebar settings" aria-label="Sidebar settings" aria-controls="sidebar-settings" aria-expanded="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.32 9v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09A1.65 1.65 0 0 0 19.4 15Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
          <button
            id="sidebar-collapse"
            class="sidebar-toggle"
            type="button"
            title="Collapse sidebar"
            aria-expanded="true"
            aria-controls="sidebar"
          >
            «
          </button>
        </div>
        <div id="sidebar-new-session" class="side-block">
          <button id="new-session" class="side-action" title="Start a new omp session in the focused pane">
            + new session
          </button>
        </div>
        <div id="session-list" class="side-list"></div>
        <section id="sidebar-settings" class="side-settings" aria-label="Sidebar settings" hidden>
          <div class="side-block settings-heading">
            <button id="sidebar-settings-back" class="side-action" type="button">← Back</button>
            <h2>Settings</h2>
          </div>
          <div class="motion-control" role="group" aria-label="Sidebar view">
            <span class="motion-label">View</span>
            <button type="button" data-sidebar-view="sessions">Sessions</button>
            <button type="button" data-sidebar-view="folders">Folders</button>
          </div>
          <div class="motion-control" role="group" aria-label="Working indicator motion">
            <span class="motion-label">Motion</span>
            <button
              type="button"
              data-motion="system"
              title="Follow the system reduced-motion setting"
            >
              System
            </button>
            <button type="button" data-motion="animate" title="Always animate the working indicator">
              On
            </button>
            <button type="button" data-motion="reduce" title="Freeze the working indicator">
              Off
            </button>
          </div>
          <div class="motion-control" role="group" aria-label="Completion notifications">
            <span class="motion-label">Completions</span>
            <button
              id="notifications-toggle"
              type="button"
              aria-pressed="false"
              title="Enable or disable completion notifications"
            >
              Off
            </button>
          </div>
          <span id="notifications-status" class="motion-label" role="status" aria-live="polite">
            Completion notifications are off.
          </span>
          <div class="shortcut-settings">
            <h3>Keyboard shortcuts</h3>
            <p class="shortcut-help">
              Use Ctrl, Meta, Alt, or Shift on the first key. Separate sequence presses with commas and alternatives with semicolons.
            </p>
            <div id="shortcut-list"></div>
            <div class="shortcut-actions">
              <button id="shortcut-save" type="button">Save shortcuts</button>
              <button id="shortcut-reset" type="button">Reset defaults</button>
            </div>
            <p id="shortcut-message" class="shortcut-message" role="status" aria-live="polite"></p>
          </div>
        </section>
        <div class="side-status">
          <span id="status" class="status" data-kind="idle">connecting…</span>
        </div>
      </aside>
      <div
        id="sidebar-resizer"
        class="sidebar-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize sidebar"
        aria-controls="sidebar"
        aria-valuemin="190"
        aria-valuemax="560"
        aria-valuenow="278"
        tabindex="0"
        title="Drag to resize · double-click to reset"
      ></div>
      <button
        id="sidebar-expand"
        class="sidebar-expand"
        type="button"
        title="Expand sidebar"
        aria-expanded="false"
        aria-controls="sidebar"
        hidden
      >
        »
      </button>
      <section id="workspace">
        <nav class="space-bar" aria-label="Browser spaces">
          <div id="space-tabs" role="tablist" aria-label="Spaces"></div>
          <button id="new-space" type="button" title="New space" aria-label="New space">+</button>
        </nav>
        <main id="panes"></main>
      </section>
    </div>
    <span id="build" hidden></span>
    <script type="module" src="/client.js"></script>
  </body>
</html>
